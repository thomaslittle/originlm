name: Close inactive issues and pull requests

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 21
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'pinned,security,good first issue,help wanted'
          exempt-pr-labels: 'pinned,security,good first issue,help wanted'
          stale-issue-message: |
            This issue has been inactive for 60 days. It will close in 21 days unless there is new activity. Comment if it is still relevant.
          stale-pr-message: |
            This pull request has been inactive for 60 days. It will close in 21 days unless there is new activity. Comment if you are still working on it.
          close-issue-message: |
            Closing after 21 days of inactivity. Reopen or file a new issue if it is still relevant.
          close-pr-message: |
            Closing after 21 days of inactivity. Reopen or open a new pull request if you want to continue.
          operations-per-run: 30
          remove-stale-when-updated: true
