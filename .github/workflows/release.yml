name: Prepare release artifacts

# Preparation only: no registry, GitHub release, signing or deployment authority.
# A tag cannot publish private preview packages. See docs/release/PUBLISHING.md.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/prepare_helper_archive.py'
      - 'scripts/license_closure.py'
      - 'scripts/helper_smoke.py'
      - 'scripts/verify_helper_archive.py'
      - 'scripts/release_targets.py'
      - 'scripts/npm-*.mjs'
      - 'scripts/stage_python_package.py'
      - 'scripts/verify_npm_release.py'
      - 'scripts/npm_consumer_smoke.py'
      - 'scripts/npm_registry_consumer_smoke.py'
      - 'scripts/pack_npm_tarball.py'
      - 'scripts/assemble_npm_release.py'
permissions:
  contents: read
concurrency:
  group: release-prepare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, plat: linux_x86_64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, plat: linux_aarch64 }
          - { target: x86_64-apple-darwin, os: macos-15-intel, plat: macosx_15_0_x86_64 }
          - { target: aarch64-apple-darwin, os: macos-15, plat: macosx_15_0_arm64 }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, plat: win_amd64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Read release version
        id: release
        shell: bash
        run: |
          version="$(python -c "import json; print(json.load(open('package.json'))['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build native helper and SDK
        shell: bash
        run: |
          cargo build --release --locked -p originlm-cli --bin originlm --target '${{ matrix.target }}'
          npm ci --ignore-scripts
          npm run build --workspace originlm
          python -m pip install -r scripts/requirements-build.txt
      - name: Native helper smoke gate (built executable)
        shell: bash
        run: |
          binary='target/${{ matrix.target }}/release/originlm'
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python scripts/helper_smoke.py --binary "$binary" --target '${{ matrix.target }}' \
            --version '${{ steps.release.outputs.version }}' \
            --out "$RUNNER_TEMP/helper-binary-${{ matrix.target }}.json"
      - name: Stage exact target artifacts
        shell: bash
        run: |
          binary='target/${{ matrix.target }}/release/originlm'
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python scripts/prepare_helper_archive.py --binary "$binary" --target '${{ matrix.target }}' \
            --out prepared --source-commit "$GITHUB_SHA" \
            --metadata-out "prepared/metadata/${{ matrix.target }}"
          node scripts/npm-platform-packages.mjs --binary "$binary" --target '${{ matrix.target }}' --out npm-out \
            --metadata "prepared/metadata/${{ matrix.target }}"
          node scripts/npm-add-platform-deps.mjs --packages npm-out --sdk packages/sdk-typescript --out npm-sdk \
            --release --all-platforms
          mkdir -p prepared/npm
          for dir in npm-out/*; do npm pack "$PWD/$dir" --ignore-scripts --pack-destination "$PWD/prepared/npm"; done
          # zlib implementations differ across OS runners, so one canonical SDK
          # tarball is packed here instead of five platform-dependent gzip files.
          if [ '${{ matrix.target }}' = 'x86_64-unknown-linux-gnu' ]; then
            python scripts/pack_npm_tarball.py --package npm-sdk --out prepared/npm \
              --require dist/index.js --require node/auto.mjs --require LICENSE --require THIRD_PARTY_NOTICES.md
          fi
          python scripts/stage_python_package.py --binary "$binary" --target '${{ matrix.target }}' --plat-name '${{ matrix.plat }}' --out wheels
          (cd wheels/originlm && python setup.py bdist_wheel --plat-name '${{ matrix.plat }}' --dist-dir ../../prepared)
      - name: Verify packaged npm release and fresh consumer
        shell: bash
        run: |
          sdk="$(ls prepared/npm/originlm-*.tgz | grep -v '/originlm-cli-' | head -1)"
          platform="$(ls prepared/npm/originlm-cli-*.tgz | head -1)"
          test -n "$sdk" && test -n "$platform"
          python scripts/verify_npm_release.py --packages prepared/npm \
            --version '${{ steps.release.outputs.version }}' --source-commit "$GITHUB_SHA" \
            --out "prepared/evidence/npm-packages-${{ matrix.target }}.json"
          python scripts/npm_consumer_smoke.py --sdk "$sdk" --platform "$platform" \
            --version '${{ steps.release.outputs.version }}' --target '${{ matrix.target }}' \
            --out "prepared/evidence/npm-consumer-${{ matrix.target }}.json"
      - name: Persist native smoke evidence
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, shutil
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / f'helper-binary-${{ matrix.target }}.json'
          target = pathlib.Path('prepared/evidence')
          target.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source, target / source.name)
          PY
      - name: Verify helper archive and extracted executable
        shell: bash
        run: |
          archive='prepared/originlm-${{ matrix.target }}'
          if [ "$RUNNER_OS" = Windows ]; then archive="$archive.zip"; else archive="$archive.tar.gz"; fi
          python scripts/verify_helper_archive.py --archive "$archive" --target '${{ matrix.target }}' \
            --version '${{ steps.release.outputs.version }}' --source-commit "$GITHUB_SHA" \
            --out "prepared/evidence/helper-archive-${{ matrix.target }}.json"
      - name: Assert persisted evidence
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          target = os.environ['TARGET']
          directory = pathlib.Path('prepared/evidence')
          for name in ('helper-binary', 'helper-archive', 'npm-packages', 'npm-consumer'):
              path = directory / f'{name}-{target}.json'
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing persisted evidence: {path}')
              evidence = json.loads(path.read_text(encoding='utf-8'))
              if evidence.get('status') != 'pass' or evidence.get('target') != target:
                  raise SystemExit(f'failed evidence: {path}')
          archive = json.loads((directory / f'helper-archive-{target}.json').read_text(encoding='utf-8'))
          if archive.get('sourceCommit') != os.environ['GITHUB_SHA']:
              raise SystemExit('archive evidence source commit does not match GITHUB_SHA')
          PY
      - name: Preserve unsigned preview artifacts
        uses: actions/upload-artifact@v7
        with:
          name: prepared-${{ matrix.target }}
          path: prepared/
          if-no-files-found: error
      - name: State release boundaries
        shell: bash
        run: |
          echo 'Unsigned preview artifacts only. No packages, registries, GitHub releases, Authenticode signatures, notarization or trusted update signatures were produced.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Each runner executed --version, an empty-home passive scan and a bounded stdio handshake against the built helper and the helper extracted from the final archive.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Archives contain helper-<target>/originlm[.exe], LICENSE, per-target dependency notices and license texts, sbom.cdx.json and manifest.json with member paths, byte lengths and SHA-256.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Native smoke, archive, universal npm package and fresh npm consumer evidence is persisted under prepared/evidence/ so it is uploaded with the artifact (not in a hidden directory).' >> "$GITHUB_STEP_SUMMARY"
          echo 'The npm SDK is one universal originlm tarball with all five exact-version originlm-cli-* optional dependencies; each platform package carries its native manifest, SBOM, notices and license texts.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Linux wheels use host-specific linux tags, not an unverified manylinux promise; helper glibc baselines are recorded per archive.' >> "$GITHUB_STEP_SUMMARY"
          echo 'See docs/release/PUBLISHING.md for compatibility, signing and publication gates.' >> "$GITHUB_STEP_SUMMARY"

  assemble-npm:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read release version
        id: release
        shell: bash
        run: |
          version="$(python -c "import json; print(json.load(open('package.json'))['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download all target npm artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: prepared-*
          merge-multiple: false
      - name: Assemble and verify one universal SDK plus five platform packages
        shell: bash
        run: |
          python scripts/assemble_npm_release.py --artifacts artifacts --out npm-release \
            --version '${{ steps.release.outputs.version }}' --source-commit "$GITHUB_SHA"
      - name: Prove single-package optional dependency resolution
        shell: bash
        run: |
          python scripts/npm_registry_consumer_smoke.py --release-dir npm-release \
            --version '${{ steps.release.outputs.version }}' \
            --out npm-release/evidence/registry-consumer.json
      - name: Preserve the reviewed npm release set
        uses: actions/upload-artifact@v7
        with:
          name: npm-release
          path: npm-release/
          if-no-files-found: error
      - name: State npm release-set boundaries
        shell: bash
        run: |
          echo 'One universal originlm SDK and five exact-version platform packages were assembled.' >> "$GITHUB_STEP_SUMMARY"
          echo 'All five SDK tarballs must be byte-identical; native helper/license hashes are checked against qualified manifests.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A temporary local registry proved single-package `npm install originlm` resolves the optional platform package and starts the bundled helper.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No npm publication or credential use occurred in this workflow.' >> "$GITHUB_STEP_SUMMARY"
