name: Prepare release artifacts

# Preparation only: no registry, GitHub release, signing or deployment authority.
# A tag cannot publish private preview packages. See docs/release/PUBLISHING.md.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/prepare_helper_archive.py'
      - 'scripts/license_closure.py'
      - 'scripts/helper_smoke.py'
      - 'scripts/verify_helper_archive.py'
      - 'scripts/release_targets.py'
      - 'scripts/npm-*.mjs'
      - 'scripts/stage_python_package.py'
permissions:
  contents: read
concurrency:
  group: release-prepare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, plat: linux_x86_64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, plat: linux_aarch64 }
          - { target: x86_64-apple-darwin, os: macos-15-intel, plat: macosx_15_0_x86_64 }
          - { target: aarch64-apple-darwin, os: macos-15, plat: macosx_15_0_arm64 }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, plat: win_amd64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Read release version
        id: release
        shell: bash
        run: |
          version="$(python -c "import json; print(json.load(open('package.json'))['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build native helper and SDK
        shell: bash
        run: |
          cargo build --release --locked -p originlm-cli --bin originlm --target '${{ matrix.target }}'
          npm ci --ignore-scripts
          npm run build --workspace originlm
          python -m pip install -r scripts/requirements-build.txt
      - name: Native helper smoke gate (built executable)
        shell: bash
        run: |
          binary='target/${{ matrix.target }}/release/originlm'
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python scripts/helper_smoke.py --binary "$binary" --target '${{ matrix.target }}' \
            --version '${{ steps.release.outputs.version }}' \
            --out "$RUNNER_TEMP/helper-binary-${{ matrix.target }}.json"
      - name: Stage exact target artifacts
        shell: bash
        run: |
          binary='target/${{ matrix.target }}/release/originlm'
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python scripts/prepare_helper_archive.py --binary "$binary" --target '${{ matrix.target }}' \
            --out prepared --source-commit "$GITHUB_SHA"
          node scripts/npm-platform-packages.mjs --binary "$binary" --target '${{ matrix.target }}' --out npm-out
          node scripts/npm-add-platform-deps.mjs --packages npm-out --sdk packages/sdk-typescript --out npm-sdk --preview
          mkdir -p prepared/npm
          for dir in npm-out/* npm-sdk; do npm pack "$PWD/$dir" --ignore-scripts --pack-destination "$PWD/prepared/npm"; done
          python scripts/stage_python_package.py --binary "$binary" --target '${{ matrix.target }}' --plat-name '${{ matrix.plat }}' --out wheels
          (cd wheels/originlm && python setup.py bdist_wheel --plat-name '${{ matrix.plat }}' --dist-dir ../../prepared)
      - name: Persist native smoke evidence
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, shutil
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / f'helper-binary-${{ matrix.target }}.json'
          target = pathlib.Path('prepared/evidence')
          target.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source, target / source.name)
          PY
      - name: Verify helper archive and extracted executable
        shell: bash
        run: |
          archive='prepared/originlm-${{ matrix.target }}'
          if [ "$RUNNER_OS" = Windows ]; then archive="$archive.zip"; else archive="$archive.tar.gz"; fi
          python scripts/verify_helper_archive.py --archive "$archive" --target '${{ matrix.target }}' \
            --version '${{ steps.release.outputs.version }}' --source-commit "$GITHUB_SHA" \
            --out "prepared/evidence/helper-archive-${{ matrix.target }}.json"
      - name: Assert persisted evidence
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          target = os.environ['TARGET']
          directory = pathlib.Path('prepared/evidence')
          for name in ('helper-binary', 'helper-archive'):
              path = directory / f'{name}-{target}.json'
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing persisted evidence: {path}')
              evidence = json.loads(path.read_text(encoding='utf-8'))
              if evidence.get('status') != 'pass' or evidence.get('target') != target:
                  raise SystemExit(f'failed evidence: {path}')
          archive = json.loads((directory / f'helper-archive-{target}.json').read_text(encoding='utf-8'))
          if archive.get('sourceCommit') != os.environ['GITHUB_SHA']:
              raise SystemExit('archive evidence source commit does not match GITHUB_SHA')
          PY
      - name: Preserve unsigned preview artifacts
        uses: actions/upload-artifact@v7
        with:
          name: prepared-${{ matrix.target }}
          path: prepared/
          if-no-files-found: error
      - name: State release boundaries
        shell: bash
        run: |
          echo 'Unsigned preview artifacts only. No packages, registries, GitHub releases, Authenticode signatures, notarization or trusted update signatures were produced.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Each runner executed --version, an empty-home passive scan and a bounded stdio handshake against the built helper and the helper extracted from the final archive.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Archives contain helper-<target>/originlm[.exe], LICENSE, per-target dependency notices and license texts, sbom.cdx.json and manifest.json with member paths, byte lengths and SHA-256.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Native smoke and archive evidence is persisted under prepared/evidence/ so it is uploaded with the artifact (not in a hidden directory).' >> "$GITHUB_STEP_SUMMARY"
          echo 'Linux wheels use host-specific linux tags, not an unverified manylinux promise; helper glibc baselines are recorded per archive.' >> "$GITHUB_STEP_SUMMARY"
          echo 'See docs/release/PUBLISHING.md for compatibility, signing and publication gates.' >> "$GITHUB_STEP_SUMMARY"
