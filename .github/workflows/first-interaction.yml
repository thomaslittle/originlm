name: Welcome first-time contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            Thanks for opening your first issue. Please include a minimal reproduction and redact tokens, account data, and personal paths. See CONTRIBUTING.md.
          pr_message: |
            Thanks for your first pull request. Please fill in the PR template and keep tests synthetic. A maintainer will review soon.
