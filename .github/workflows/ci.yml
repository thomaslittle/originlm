name: Native SDK and package verification
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Desktop logic plus headless in-process GPUI view tests. This is the
  # pyramid's view layer: real views, real clicks, no OS window or SendInput.
  # The full workspace logic matrix stays in `verify`.
  desktop:
    name: desktop-view-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: ${{ matrix.os }}-desktop
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libfreetype6-dev pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev
      - name: Run desktop logic and in-process view tests
        run: cargo test -p originlm-desktop --locked

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
        phase: [verify, lint, package]
    runs-on: ${{ matrix.os }}
    # Run independent gates concurrently; each phase still has its own result.
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (Linux runner)
        if: runner.os == 'Linux' && matrix.phase != 'lint'
        run: |
          # The debug test build plus the release bundle exceed the default runner disk.
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-node@v7
        if: matrix.phase != 'lint'
        with:
          node-version: '22.20.0'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        if: matrix.phase == 'verify'
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.os }}-${{ matrix.phase }}
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libfreetype6-dev pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev
      - name: Install build-only dependencies
        if: matrix.phase != 'lint'
        run: |
          npm ci --ignore-scripts
          python -m pip install -r scripts/requirements-build.txt
      - name: Install Playwright browser
        if: matrix.phase == 'verify'
        run: |
          npx --no-install playwright install --with-deps chromium
      - name: Full deterministic verification (no provider inference)
        if: matrix.phase == 'verify'
        run: python scripts/verify.py --profile all
      - name: Plain HTTP C# consumer
        if: matrix.phase == 'verify'
        run: python scripts/test_dotnet.py
      - name: Formatting and lint
        if: matrix.phase == 'lint'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build local artifacts and exercise clean consumers
        if: matrix.phase == 'package'
        run: |
          python scripts/build_release.py --profile release
          python scripts/package_smoke.py
      - name: Preserve actual evidence and artifacts
        if: always() && matrix.phase != 'lint'
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.os }}-${{ matrix.phase }}
          path: |
            .verification/verify-last.json
            .verification/package-smoke.json
            .verification/adapter-conformance.json
            dist/release/*.zip
            dist/release/*.sha256
            dist/release/latest.json
          if-no-files-found: warn
