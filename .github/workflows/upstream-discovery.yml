name: Upstream discovery watch
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-discovery
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      can_open_pr: ${{ steps.permission.outputs.can_open_pr }}
    steps:
      - name: Check repository PR-creation permission
        id: permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          value=$(gh api "repos/${{ github.repository }}/actions/permissions/workflow" --jq '.can_approve_pull_request_reviews // false' 2>/dev/null || echo false)
          echo "can_open_pr=$value" >> "$GITHUB_OUTPUT"
          if [ "$value" != "true" ]; then
            {
              echo "### Upstream watch is in report-only mode"
              echo ""
              echo "GitHub Actions is not permitted to create or approve pull requests."
              echo "Detection still runs and its report is uploaded as an artifact."
              echo ""
              echo "Minimum setting change: **Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests**."
              echo "No personal token or broader repository permission is used as a shortcut."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Upstream reports are artifact-only::GitHub Actions cannot create pull requests; see the step summary for the minimum setting change."
          fi
  tokscale:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Compare Tokscale discovery knowledge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          OPEN_PR_FLAG: ${{ needs.preflight.outputs.can_open_pr == 'true' && '--open-pr' || '--report-only' }}
        run: python scripts/upstream_sync.py "$OPEN_PR_FLAG"
      - name: Upload durable Tokscale report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-tokscale-report
          path: upstream/tokscale/reviews/latest
          if-no-files-found: ignore
          retention-days: 30
  t3code:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compare T3 Code provider surface
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          OPEN_PR_FLAG: ${{ needs.preflight.outputs.can_open_pr == 'true' && '--open-pr' || '--report-only' }}
        run: python scripts/upstream_t3code.py "$OPEN_PR_FLAG"
      - name: Upload durable T3 Code report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-t3code-report
          path: upstream/t3code/reviews/latest
          if-no-files-found: ignore
          retention-days: 30
