name: Publish npm packages

# Manual, protected publisher for subsequent versions. Defaults to dry-run; an
# actual publish requires the release-npm environment approval and
# confirm=PUBLISH. The first publication of each package is a manual bootstrap
# from the authenticated maintainer PC; OIDC cannot create new npm packages.
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Prepare release artifacts run ID containing npm-release'
        required: true
        type: string
      source_commit:
        description: 'Full integrated main commit SHA used to build the artifacts'
        required: true
        type: string
      dist_tag:
        description: 'npm dist-tag for the universal SDK and platform packages'
        required: true
        default: 'alpha'
        type: choice
        options: ['alpha', 'latest']
      dry_run:
        description: 'Verify only; do not publish'
        required: true
        default: true
        type: boolean
      confirm:
        description: 'Type PUBLISH to allow an actual publish when dry_run is false'
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: publish-npm
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-npm
    steps:
      - name: Require explicit publication confirmation
        if: ${{ !inputs.dry_run && inputs.confirm != 'PUBLISH' }}
        run: |
          echo 'Refusing to publish: set confirm=PUBLISH.' >&2
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify the artifact came from integrated main at this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.artifact_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          gh run view "$RUN_ID" --json headSha,headBranch,conclusion,status > run.json
          python - <<'PY'
          import json, os
          run = json.load(open('run.json'))
          if run.get('headSha') != os.environ['SOURCE_COMMIT']:
              raise SystemExit('artifact run head SHA does not match source_commit')
          if run.get('headBranch') != 'main' or run.get('conclusion') != 'success':
              raise SystemExit('artifact run is not a successful integrated-main run')
          PY
      - name: Download the reviewed npm release set and all five consumer proofs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.artifact_run_id }}
        run: gh run download "$RUN_ID" --pattern 'npm-*' --dir artifacts
      - name: Verify checksums, source version and native payload hashes
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          cd artifacts/npm-release
          sha256sum -c SHA256SUMS
          cd ../..
          version="$(python -c "import json; print(json.load(open('artifacts/npm-release/manifest.json'))['version'])")"
          test "$(python -c "import json; print(json.load(open('artifacts/npm-release/manifest.json'))['sourceCommit'])")" = "$SOURCE_COMMIT"
          python scripts/verify_npm_release.py --packages artifacts/npm-release \
            --version "$version" --source-commit "$SOURCE_COMMIT" --require-all
          python scripts/verify_npm_consumer_matrix.py --artifacts artifacts \
            --version "$version" --source-commit "$SOURCE_COMMIT"
      - name: Confirm trusted-publishing-capable npm
        run: npx --yes npm@11.5.1 --version
      - name: Require packages to exist before OIDC publish
        if: ${{ !inputs.dry_run }}
        run: |
          for name in originlm originlm-cli-linux-x64 originlm-cli-linux-arm64 \
            originlm-cli-darwin-arm64 originlm-cli-darwin-x64 originlm-cli-windows-x64; do
            if ! npm view "$name" version >/dev/null 2>&1; then
              echo "$name has not been bootstrapped; publish it manually first" >&2
              exit 1
            fi
          done
      - name: Publish platform packages then universal SDK
        if: ${{ !inputs.dry_run }}
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          for tarball in artifacts/npm-release/originlm-cli-*.tgz; do
            echo "publishing $tarball"
            npx --yes npm@11.5.1 publish "$tarball" --access public --tag "$DIST_TAG" --provenance
          done
          for tarball in artifacts/npm-release/originlm-[0-9]*.tgz; do
            echo "publishing universal SDK $tarball"
            npx --yes npm@11.5.1 publish "$tarball" --access public --tag "$DIST_TAG" --provenance
          done
      - name: State publication result
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo 'Dry run: verification passed; no npm package was published.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Published five platform packages and the universal originlm SDK via npm trusted publishing.' >> "$GITHUB_STEP_SUMMARY"
          fi
