name: Prepare crate release set

# Read-only packaging gate. Does not publish or need registry credentials.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prepare-crates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Fetch locked dependencies for offline packaging
        run: cargo fetch --locked
      - name: Validate closure, MSRV declaration and package all crates in order
        run: python scripts/publish_order.py --check --package --package-dir crates-release
      - name: Verify crate release checksums
        run: cd crates-release && sha256sum -c SHA256SUMS
      - name: Preserve crate release set
        uses: actions/upload-artifact@v7
        with:
          name: crates-release
          path: crates-release/
          if-no-files-found: error
      - name: State boundaries
        run: |
          echo 'Read-only crate packaging only. No crates.io publication or token was used.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The artifact contains only the 13 publishable crates in dependency-first order, with SHA256SUMS and a source-commit manifest.' >> "$GITHUB_STEP_SUMMARY"
