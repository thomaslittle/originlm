name: Universal product policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  universal-product:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refuse application- or business-specific logic
        run: |
          python3 .github/scripts/check_universal_policy.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
      - name: Explain the refusal
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body \
            "OriginLM is a universal product. This PR was refused because it adds application-specific or business-specific logic. Move it to the consuming application, or propose a generic adapter/configuration. See docs/POLICY-UNIVERSAL-PRODUCT.md."
