[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "originlm"
version = "0.1.0a29"
description = "Thin native-helper protocol client for OriginLM"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
classifiers = ["Private :: Do Not Upload"]

[project.urls]
Homepage = "https://originlm.pages.dev/"
Repository = "https://github.com/thomaslittle/originlm"
Documentation = "https://github.com/thomaslittle/originlm/blob/main/docs/integration/quickstarts.md"
Issues = "https://github.com/thomaslittle/originlm/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
originlm = ["py.typed", "*.pyi"]
