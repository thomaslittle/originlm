[package]
name = "originlm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OriginLM native helper CLI: discovery, metadata, execution and the local service."

[features]
os-notifications = ["originlm-service/os-notifications"]

[[bin]]
name = "originlm"
path = "src/main.rs"

[dependencies]
originlm-kit = { version = "0.1.0-alpha.22", path = "../originlm-kit" }
originlm-adapters = { version = "0.1.0-alpha.22", path = "../originlm-adapters" }
originlm-contracts = { version = "0.1.0-alpha.22", path = "../originlm-contracts" }
originlm-core = { version = "0.1.0-alpha.22", path = "../originlm-core" }
originlm-discovery = { version = "0.1.0-alpha.22", path = "../originlm-discovery" }
originlm-platform = { version = "0.1.0-alpha.22", path = "../originlm-platform" }
originlm-service = { version = "0.1.0-alpha.22", path = "../originlm-service" }
originlm-control = { version = "0.1.0-alpha.22", path = "../originlm-control", default-features = false }
originlm-transports = { version = "0.1.0-alpha.22", path = "../originlm-transports" }
originlm-chatgpt-auth = { version = "0.1.0-alpha.22", path = "../originlm-chatgpt-auth" }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "signal", "macros", "time"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[[bin]]
name = "originlm-native-host"
path = "src/native_main.rs"

[[bin]]
name = "originlm-auth-blocker"
path = "src/auth_blocker.rs"
