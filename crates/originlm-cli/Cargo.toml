[package]
name = "originlm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
os-notifications = ["originlm-service/os-notifications"]

[[bin]]
name = "originlm"
path = "src/main.rs"

[dependencies]
originlm-kit = { path = "../originlm-kit" }
originlm-adapters = { path = "../originlm-adapters" }
originlm-contracts = { path = "../originlm-contracts" }
originlm-core = { path = "../originlm-core" }
originlm-discovery = { path = "../originlm-discovery" }
originlm-platform = { path = "../originlm-platform" }
originlm-service = { path = "../originlm-service" }
originlm-control = { path = "../originlm-control", default-features = false }
originlm-transports = { path = "../originlm-transports" }
originlm-chatgpt-auth = { path = "../originlm-chatgpt-auth" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "signal", "macros", "time"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[[bin]]
name = "originlm-native-host"
path = "src/native_main.rs"

[[bin]]
name = "originlm-auth-blocker"
path = "src/auth_blocker.rs"
