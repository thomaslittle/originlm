[package]
name = "originlm-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Broker client and control views for OriginLM"
publish = true

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[[bin]]
name = "originlm-control"
path = "src/main.rs"
required-features = ["tui"]

[dependencies]
originlm-platform = { version = "0.1.0-alpha.20", path = "../originlm-platform" }
originlm-contracts = { version = "0.1.0-alpha.20", path = "../originlm-contracts" }
originlm-transports = { version = "0.1.0-alpha.20", path = "../originlm-transports" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util"] }
ratatui = { version = "0.30.2", optional = true, default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", optional = true }

[dev-dependencies]
originlm-core = { version = "0.1.0-alpha.20", path = "../originlm-core" }
originlm-discovery = { version = "0.1.0-alpha.20", path = "../originlm-discovery" }
originlm-service = { version = "0.1.0-alpha.20", path = "../originlm-service" }
tempfile = "3"

[lints]
workspace = true
