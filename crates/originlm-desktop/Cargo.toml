[package]
name = "originlm-desktop"
version.workspace = true
edition = "2024"
license = "MIT"
publish = false
description = "Native GPUI desktop manager for OriginLM"

[[bin]]
name = "originlm-desktop"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "0.9.0", features = ["gpui-fast"] }
originlm-control = { version = "0.1.0-alpha.25", path = "../originlm-control", default-features = false }
originlm-platform = { version = "0.1.0-alpha.25", path = "../originlm-platform" }
originlm-contracts = { version = "0.1.0-alpha.25", path = "../originlm-contracts" }
originlm-discovery = { version = "0.1.0-alpha.25", path = "../originlm-discovery" }
originlm-kit = { version = "0.1.0-alpha.25", path = "../originlm-kit" }
originlm-transports = { version = "0.1.0-alpha.25", path = "../originlm-transports" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
gpui-kit = { version = "0.9.0", features = ["gpui-fast", "test-support"] }
