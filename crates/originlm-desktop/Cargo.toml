[package]
name = "originlm-desktop"
version.workspace = true
edition = "2024"
license = "MIT"
publish = false
description = "Native GPUI desktop manager for OriginLM"

[[bin]]
name = "originlm-desktop"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "0.9.0", features = ["gpui-fast"] }
# SPIKE: Longbridge NSH's GPUI backend. `js` only (no webview/video) so the
# spike does not drag wry/GTK/GStreamer into the desktop build.
nsh-platform-gpui = { git = "https://github.com/longbridge/nsh", rev = "341db7a20fababe6b575f24dd1a344ad81e9044f", default-features = false, features = ["js"] }

originlm-control = { version = "0.1.0-alpha.28", path = "../originlm-control", default-features = false }
originlm-platform = { version = "0.1.0-alpha.28", path = "../originlm-platform" }
originlm-contracts = { version = "0.1.0-alpha.28", path = "../originlm-contracts" }
originlm-discovery = { version = "0.1.0-alpha.28", path = "../originlm-discovery" }
originlm-kit = { version = "0.1.0-alpha.28", path = "../originlm-kit" }
originlm-transports = { version = "0.1.0-alpha.28", path = "../originlm-transports" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
# SPIKE: compiles nsh/ProviderCard.tsx to JS, as `nsh build` does.
nsh-bundler = { git = "https://github.com/longbridge/nsh", rev = "341db7a20fababe6b575f24dd1a344ad81e9044f", features = ["bundle"] }

[dev-dependencies]
# `test-support` provides the headless TestAppContext used by the in-process
# GPUI view tests. It is enabled only for test targets.
gpui-kit = { version = "0.9.0", features = ["gpui-fast", "test-support"] }
originlm-runtime = { version = "0.1.0-alpha.28", path = "../originlm-runtime" }
originlm-service = { version = "0.1.0-alpha.28", path = "../originlm-service" }
tempfile = "3"
