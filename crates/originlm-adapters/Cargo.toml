[package]
name = "originlm-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native and HTTP provider adapters for OriginLM"
publish = true

[dependencies]
rusqlite = { version = "0.43.0", features = ["bundled", "limits"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
zeroize = "1"
base64 = "0.22"
process-wrap = { version = "10.0.1", features = ["tokio1"] }
originlm-runtime = { version = "0.1.0-alpha.29", path = "../originlm-runtime" }
originlm-contracts = { version = "0.1.0-alpha.29", path = "../originlm-contracts" }
originlm-discovery = { version = "0.1.0-alpha.29", path = "../originlm-discovery" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tempfile = "3"
getrandom = "0.4"
sha2.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
originlm-platform = { version = "0.1.0-alpha.29", path = "../originlm-platform" }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.8.9"
